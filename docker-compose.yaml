services:
  app:
    build: .
    container_name: tasker-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://tasker-database:5432/tasker
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=secret
    depends_on:
      - database

  database:
    image: postgres:15
    container_name: tasker-database
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: tasker
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
